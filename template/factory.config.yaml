# factory.config.yaml - ultimate-factory model, provider and runtime configuration.
#
# Secrets NEVER go in this file. Every key is read from an environment variable whose NAME
# you give in an *_env field. Values may use ${ENV_VAR} or ${ENV_VAR:-default} interpolation.
# A literal key (sk-..., Bearer ..., etc.) anywhere in this file is rejected at load time.
#
# Switch providers without editing:   ufactory --profile portkey <command>
#                                 or:   export UFACTORY_PROFILE=portkey
# Check the result:                     ufactory models    /   ufactory doctor --ping
version: 1

# ---------------------------------------------------------------------------------------------
# Providers: where requests go. Any number; refer to them by name in models.
# type: openai | portkey | azure-openai | openai-compatible
# ---------------------------------------------------------------------------------------------
providers:
  openai:
    type: openai
    base_url: https://api.openai.com/v1          # default; change for a proxy
    api_key_env: OPENAI_API_KEY
    # organization_env: OPENAI_ORG_ID
    # project_env: OPENAI_PROJECT_ID

  portkey:
    type: portkey
    base_url: ${PORTKEY_BASE_URL:-https://api.portkey.ai/v1}   # self-hosted gateway: http://localhost:8787/v1
    api_key_env: PORTKEY_API_KEY                  # x-portkey-api-key
    # Routing (first one set wins):
    #   1. config:            a saved Portkey config id (fallbacks, load balancing, caching, guardrails)
    #   2. virtual_key_env:   legacy virtual key
    #   3. provider:          upstream slug (e.g. "openai", "@openai-prod") + optional provider_api_key_env
    #   4. none of the above: the model name must be a Model Catalog reference "@<provider-slug>/<model>"
    # config: ${PORTKEY_CONFIG_ID:-}
    # virtual_key_env: PORTKEY_VIRTUAL_KEY
    # provider: openai
    # provider_api_key_env: OPENAI_API_KEY
    metadata:                                     # sent as x-portkey-metadata (plus run_id, stage, role)
      app: ultimate-factory
      environment: ${FACTORY_ENV:-dev}
    timeout_ms: 180000
    max_retries: 4

  # azure:
  #   type: azure-openai
  #   base_url: https://YOUR-RESOURCE.openai.azure.com
  #   api_key_env: AZURE_OPENAI_API_KEY
  #   api_version: 2024-10-21                     # set -> deployments path; model = deployment name
  #
  # local:                                        # Ollama, vLLM, LM Studio, LiteLLM proxy ...
  #   type: openai-compatible
  #   base_url: http://localhost:11434/v1
  #   api_key_env: ""                             # no auth
  #   capabilities: { tools: true, json_mode: false, usage: true, temperature: true }

# ---------------------------------------------------------------------------------------------
# Models: default + per-role overrides. Roles: triage spec implement verify critic review monitor
# Each entry: provider, model, and optional temperature, top_p, max_output_tokens,
# reasoning_effort (minimal|low|medium|high), token_param (max_completion_tokens|max_tokens),
# json_mode, extra_body (merged into the request verbatim), and fallbacks: a list of models tried
# in order when this one fails after its retries (automatic switching; same keys, or a bare name).
# Tip: use a DIFFERENT model for verify/critic than implement (independent judgement).
# ---------------------------------------------------------------------------------------------
models:
  default:
    provider: openai
    model: gpt-5.1
  roles:
    triage:    { model: gpt-5.1-mini }
    implement:
      model: gpt-5.1
      max_output_tokens: 16000
      reasoning_effort: medium
      fallbacks: [ gpt-4.1 ]       # used only if gpt-5.1 fails after retries
    verify:    { model: o4-mini, reasoning_effort: high }   # a different model from implement
    critic:    { model: gpt-4.1 }
    review:    { model: gpt-5.1-mini }
    monitor:   { model: gpt-5.1-mini }

# Profiles overlay `models` when selected (--profile, UFACTORY_PROFILE, or active_profile).
active_profile: openai          # or portkey; overridden by --profile / UFACTORY_PROFILE
profiles:
  openai:
    models: {}                                    # use the models above as-is
  portkey:
    models:
      default: { provider: portkey, model: "@openai/gpt-5.1" }
      roles:
        triage:    { provider: portkey, model: "@openai/gpt-5.1-mini" }
        implement: { provider: portkey, model: "@openai/gpt-5.1", fallbacks: [ "@openai/gpt-4.1" ] }
        verify:    { provider: portkey, model: "@anthropic/claude-sonnet-4-5" }   # different vendor = independent verifier
        critic:    { provider: portkey, model: "@anthropic/claude-sonnet-4-5" }
        review:    { provider: portkey, model: "@openai/gpt-5.1-mini" }
        monitor:   { provider: portkey, model: "@openai/gpt-5.1-mini" }

# ---------------------------------------------------------------------------------------------
# Review panel (ufactory review). At least min_personas personas.
# Built-in: principal-architect staff-backend staff-frontend security-engineer sre-reliability
#           performance-engineer qa-test-architect devex-platform data-engineer ml-ai-engineer
#           api-design accessibility
# ---------------------------------------------------------------------------------------------
review:
  min_personas: 10
  concurrency: 4
  block_quorum: 2               # blocks needed for a panel "block"; a lone block counts as request-changes
  personas:
    - principal-architect
    - staff-backend
    - staff-frontend
    - security-engineer
    - sre-reliability
    - performance-engineer
    - qa-test-architect
    - devex-platform
    - data-engineer
    - ml-ai-engineer
  persona_models: {}
    # security-engineer: { provider: portkey, model: "@anthropic/claude-opus-4-1" }

# ---------------------------------------------------------------------------------------------
# Budgets: always on. Exceeding one stops the run (status stopped, reason budget).
# ---------------------------------------------------------------------------------------------
budget:
  max_tokens_per_run: 400000
  max_usd_per_run: 5            # uses built-in indicative prices unless you override below
  max_turns: 40                 # agent loop turns for implement
  max_runs_per_day: 50          # counted from run records in factory.runs_dir (local runs)
  # max_usd_per_day: 20          # spend cap over the last 24h, summed from run records (CI: run `ufactory records pull` first)
  max_minutes_per_run: 50       # wall clock; keep below your CI job timeout
  prices: {}
    # gpt-5.1: { input_per_mtok: 1.25, output_per_mtok: 10 }
    # "@anthropic/claude-sonnet-4-5": { input_per_mtok: 3, output_per_mtok: 15 }

# ---------------------------------------------------------------------------------------------
# Implementation agent sandbox
# ---------------------------------------------------------------------------------------------
agent:
  test_command: ""              # e.g. "npm test", "pytest -q", "go test ./...", "dotnet test"; used by run_tests and the negative-test proof
  allowed_commands: {}          # exact commands the agent may run by name, e.g. { format: "npx prettier --write ." }
  protected_extra: []           # extra globs the agent may never write
  passthrough_env: []           # extra NON-secret env vars visible to gates/tests
  max_refusals: 5
  slop: block                   # AI-slop in added lines: block (finish refused), warn (noted in the PR) or off
  sandbox:                      # where gates, tests and the proof run
    mode: none                  # none | docker | podman. docker: throwaway container, no network, no capabilities
    # image: mcr.microsoft.com/dotnet/sdk:8.0   # must contain your toolchain plus git and bash
    network: none               # none | bridge (for test suites that need the network)
  max_file_bytes: 20000          # per read_file call; the agent pages with start_line
  command_timeout_ms: 600000
  # test_paths: ["test/**", "tests/**", "**/*.test.*", "**/*.spec.*", "**/test_*.py"]

# ---------------------------------------------------------------------------------------------
# GitHub queue
# ---------------------------------------------------------------------------------------------
github:
  enabled: true
  remote: origin
  # default_branch: main        # auto-detected when omitted
  branch_prefix: factory/       # claim branch = factory/fq-<issue>; shared by every harness
  max_issues_per_triage: 20
  trusted_associations: [OWNER, MEMBER, COLLABORATOR]
  stale_claim_hours: 2
  handoff_key_env: UFACTORY_HANDOFF_KEY   # when this env var is set, handoffs are HMAC-signed and implement rejects unsigned ones

factory:
  charter: docs/factory/CHARTER.md
  contract: docs/factory/CONTRACT.md
  gates_script: .factory/scripts/gates.sh
  prove_script: .factory/scripts/prove-test.sh
  runs_dir: docs/factory/runs
  specs_dir: docs/factory/specs

spec:
  format: factory               # or "openspec" to write gates under openspec/changes/fq-<n>/

logging:
  level: info
